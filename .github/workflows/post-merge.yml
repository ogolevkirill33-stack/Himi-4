name: Post merge

env:
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: "malware-check"

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full main commit SHA to retry (defaults to this workflow commit)
        required: false
        type: string
  push:
    branches: [main]

concurrency:
  group: post-merge-main
  cancel-in-progress: false
  queue: max

jobs:
  warm-dependency-cache:
    name: Warm dependency cache (${{ matrix.runner }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: Windows
            runner: windows-latest
          - os: macOS
            runner: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_commit || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Warm dependency cache
        run: uv sync --all-packages
        if: hashFiles('pyproject.toml') != ''

      - name: Cache info
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Runner: ${{ matrix.runner }}"
          uv cache dir
